version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jain_matrimony_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jainmatrimony
      POSTGRES_PASSWORD: jainmatrimony_password_2025
      POSTGRES_DB: jain_matrimonial
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jainmatrimony"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jain_matrimony_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://jainmatrimony:jainmatrimony_password_2025@postgres:5432/jain_matrimonial
      JWT_SECRET: jain_matrimony_secret_key_2025_change_in_production
      JWT_EXPIRE: 7d
      TWILIO_ACCOUNT_SID: development_mode
      TWILIO_AUTH_TOKEN: development_mode
      TWILIO_PHONE_NUMBER: +1234567890
      APP_URL: http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  postgres_data:
    driver: local
